name: Build Components

# 直接使用 android-bionic-rootfs 项目的构建脚本
# 构建 51 个包的完整 RootFS（含 PulseAudio / Vulkan / GStreamer / ALSA 等）
#
# 关键改进：构建完成后把 rootfs-aarch64.tar.xz 发布到 GitHub Release
# 这样 Build Wine / Build Turnip 等独立 workflow 可以用 wget 直接下载，
# 彻底绕开 actions/download-artifact@v4 跨 run 下载的限制。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (aarch64)'
        type: string
        default: 'aarch64'
      release_tag:
        description: 'Release tag to publish RootFS (e.g. rootfs-v0.5). Leave empty to skip publishing.'
        type: string
        default: 'rootfs-latest'
        required: false

env:
  NDK_URL: 'https://dl.google.com/android/repository/android-ndk-r29-linux.zip'

jobs:
  build-rootfs:
    name: Build Complete RootFS
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git wget p7zip-full build-essential ccache cmake meson ninja-build \
            bzip2 xz-utils zstd libglib2.0-dev gperf python3 python3-pip \
            gobject-introspection pkg-config autoconf automake libtool libtool-bin dh-autoreconf \
            flex bison gettext libltdl-dev texinfo
          # 系统自带的 meson 版本太旧，从 pip 安装最新版
          sudo pip3 install --upgrade --ignore-installed meson mako jinja2 pyyaml

      - name: Setup build environment
        run: |
          cd /home/runner/work/winfex/winfex/scripts
          chmod +x build-rootfs-arch.sh
          chmod +x generate-prefix.sh
          chmod +x cross_file/cross-aarch64-meson.sh
          # 修改 default.conf 中的路径适配 CI 环境
          sed -i 's|ndkDir=.*|ndkDir="/home/runner/work/winfex/winfex/scripts/ndk"|' default.conf
          sed -i 's|srcDir=.*|srcDir="/home/runner/work/winfex/winfex/scripts/src"|' default.conf
          sed -i 's|pkgDir=.*|pkgDir="/home/runner/work/winfex/winfex/scripts/pkgs"|' default.conf
          sed -i 's|prefix=.*|prefix="/tmp/bionic-prefix"|' default.conf
          # NDK r29 的 clang 是 android35，不是 android29
          # 但参考项目用 api=29，说明 clang 名字不依赖 api 变量
          # NDK r29 实际的 clang 是 aarch64-linux-android35-clang
          # 修改 default.conf 让 api=35
          sed -i 's|api=.*|api="35"|' default.conf
          cat default.conf

      - name: Download NDK and apply patches
        run: |
          cd /home/runner/work/winfex/winfex/scripts
          # 直接用参考项目的脚本下载 NDK + 应用补丁
          # build-rootfs-arch.sh 会自动处理 NDK 下载 + 补丁应用
          # 但需要先确保 default.conf 路径正确
          # 修改 ndkURL 为 zip 格式（脚本内部用 7z 解压）
          sed -i 's|ndkURL=.*|ndkURL="https://dl.google.com/android/repository/android-ndk-r29-linux.zip"|' default.conf
          # 安装 7zip
          sudo apt-get install -y p7zip-full
          # 让脚本自己下载 NDK + 应用补丁
          # 先跑 apply_ndk_patches 函数（它会自动下载 NDK + 打补丁）
          # 用 source 方式加载脚本中的函数
          source default.conf
          # 手动下载 NDK（脚本用 7z，CI 上已安装）
          mkdir -p "${ndkDir}"
          wget -O /tmp/ndk.zip "${ndkURL}"
          rm -rf /tmp/ndk-tmp
          mkdir /tmp/ndk-tmp
          7z x /tmp/ndk.zip -o/tmp/ndk-tmp -snld || true
          # 找到解压目录并移动
          NDK_EXTRACTED=$(ls -d /tmp/ndk-tmp/android-ndk-*)
          cp -a "$NDK_EXTRACTED/." "${ndkDir}/"
          # 应用 NDK 补丁（完全按照参考项目的方式）
          NDK_SYSROOT="${ndkDir}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          for _patch in ndk_patches/r29/*.patch; do
            echo "Testing: $_patch"
            cd "$NDK_SYSROOT"
            if patch -p1 --dry-run <"$OLDPWD/$_patch" >/dev/null 2>&1; then
              echo "应用NDK补丁=> $_patch"
              patch --no-backup-if-mismatch -N -p1 <<<"$(cat "$OLDPWD/$_patch" | sed "s|@TERMUX_PREFIX@|${prefix}|g" | sed "s|@TERMUX_PREFIX_CLASSICAL@|${prefix}|g" | sed "s|@ROOTFS_PREFIX@|${prefix}|g" | sed "s|__TERMUX__|__ANDROID__|g")" || { echo "NDK补丁应用失败=> $_patch" && exit 1; }
            else
              echo "跳过不匹配的补丁=> $_patch"
            fi
            cd -
          done
          echo "$prefix" > "${ndkDir}/.ndk_patches_state"
          echo "NDK patches applied"
          # 验证 clang 存在
          CLANG=$(find "${ndkDir}/toolchains/llvm/prebuilt/linux-x86_64/bin/" -name "aarch64-linux-android*-clang" ! -name "*clang++*" | head -1)
          echo "Found clang: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "ERROR: clang not found"
            exit 1
          fi
          echo "NDK setup complete"
          true

      - name: Build all packages
        run: |
          cd /home/runner/work/winfex/winfex/scripts
          # 构建 aarch64 架构的所有包
          ./build-rootfs-arch.sh --arch aarch64 --build gstreamer
          # gstreamer 依赖会自动拉入所有需要的包

      - name: Package RootFS
        run: |
          cd /tmp/bionic-prefix
          tar -cJf /tmp/rootfs-aarch64.tar.xz .
          ls -lh /tmp/rootfs-aarch64.tar.xz
          echo "Contents:"
          find . -name '*.so' | head -30
          find . -name '*.so' | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-aarch64
          path: /tmp/rootfs-aarch64.tar.xz
          retention-days: 30

  build-box64:
    name: Build Box64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          set -e
          wget -q "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" -O /tmp/ndk.zip
          rm -rf /tmp/ndk-tmp /tmp/ndk
          mkdir -p /tmp/ndk-tmp
          unzip -q /tmp/ndk.zip -d /tmp/ndk-tmp
          NDK_EXTRACTED=$(ls -d /tmp/ndk-tmp/android-ndk-* | head -1)
          mkdir -p /tmp/ndk
          cp -a "$NDK_EXTRACTED/." /tmp/ndk/
      - name: Build Box64
        run: |
          NDK=/tmp/ndk
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          CLANG=$(find "$TC/bin/" -name "aarch64-linux-android*-clang" ! -name "*++*" | head -1)
          export CC="$CLANG"
          export CXX="${CLANG}++"
          git clone --depth 1 https://github.com/ptitSeb/box64.git /tmp/box64-src
          mkdir -p /tmp/box64-build && cd /tmp/box64-build
          cmake /tmp/box64-src -DCMAKE_BUILD_TYPE=Release -DANDROID=1 -DBAD_SIGNAL=1 \
            -DARM_DYNAREC=ON -DNO_CONF_INSTALL=ON -DNO_LIB_INSTALL=ON \
            -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX -G Ninja
          ninja box64
          mkdir -p /tmp/box64-pkg/local/bin
          cp box64 /tmp/box64-pkg/local/bin/
          chmod 755 /tmp/box64-pkg/local/bin/box64
      - name: Package Box64
        run: cd /tmp/box64-pkg && tar -cJf /tmp/box64-aarch64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: box64-aarch64
          path: /tmp/box64-aarch64.tar.xz

  # ============================================================
  # 发布 RootFS 到 GitHub Release —— 让其他 workflow 能直接 wget 下载
  # ============================================================
  publish-release:
    name: Publish RootFS to GitHub Release
    needs: build-rootfs
    if: ${{ github.event.inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download RootFS artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs-aarch64
          path: /tmp/rootfs-download

      - name: Verify RootFS file
        run: |
          ls -lh /tmp/rootfs-download/
          if [ ! -f /tmp/rootfs-download/rootfs-aarch64.tar.xz ]; then
            echo "ERROR: rootfs-aarch64.tar.xz not found in downloaded artifact"
            exit 1
          fi
          # 计算 sha256 供下载方校验
          cd /tmp/rootfs-download
          sha256sum rootfs-aarch64.tar.xz | tee rootfs-aarch64.tar.xz.sha256
          # 生成 manifest
          cat > MANIFEST.txt <<EOF
          # RootFS manifest
          # Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          # Source: ${{ github.repository }} @ commit ${{ github.sha }}

          file: rootfs-aarch64.tar.xz
          size: $(stat -c %s rootfs-aarch64.tar.xz) bytes
          sha256: $(sha256sum rootfs-aarch64.tar.xz | awk '{print $1}')
          so_count: $(tar -tJf rootfs-aarch64.tar.xz | grep -c '\.so$')
          EOF
          # 去除前导空格（YAML heredoc 缩进）
          sed -i 's|^          ||' MANIFEST.txt
          cat MANIFEST.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          echo "Publishing rootfs-aarch64.tar.xz to release '$TAG' on $REPO"

          # 生成 release notes 到文件（用 python 避免 shell 引号转义问题）
          python3 -c "
          import sys
          repo, tag, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          notes = f'''Auto-generated RootFS for aarch64.

          Built from commit {sha}.

          ## 文件说明

          - \`rootfs-aarch64.tar.xz\` — 完整 RootFS（X11/PulseAudio/GStreamer/GnuTLS/ALSA 等）
          - \`rootfs-aarch64.tar.xz.sha256\` — SHA256 校验和
          - \`MANIFEST.txt\` — 构建信息清单

          ## 使用方法

          其他 workflow 可用以下命令下载使用：

          \`\`\`bash
          wget -q https://github.com/{repo}/releases/download/{tag}/rootfs-aarch64.tar.xz
          wget -q https://github.com/{repo}/releases/download/{tag}/rootfs-aarch64.tar.xz.sha256
          \`\`\`
          '''
          # 去除每行前导 10 空格（YAML heredoc 缩进）
          lines = [line[10:] if line.startswith(' ' * 10) else line for line in notes.splitlines()]
          with open('/tmp/release_notes.md', 'w') as f:
              f.write('\n'.join(lines))
          " "$REPO" "$TAG" "$SHA"
          echo "=== Release notes ==="
          cat /tmp/release_notes.md

          # 检查 release 是否已存在
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists — updating."
            gh release upload "$TAG" --repo "$REPO" --clobber \
              /tmp/rootfs-download/rootfs-aarch64.tar.xz \
              /tmp/rootfs-download/rootfs-aarch64.tar.xz.sha256 \
              /tmp/rootfs-download/MANIFEST.txt
          else
            echo "Creating new release '$TAG'."
            gh release create "$TAG" --repo "$REPO" \
              --title "RootFS $TAG" \
              --notes-file /tmp/release_notes.md \
              /tmp/rootfs-download/rootfs-aarch64.tar.xz \
              /tmp/rootfs-download/rootfs-aarch64.tar.xz.sha256 \
              /tmp/rootfs-download/MANIFEST.txt
          fi

          echo "---"
          echo "Release assets:"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name)\t\(.size) bytes"'

  package-all:
    name: Package All Components
    needs: [build-rootfs, build-box64]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
      - name: Organize
        run: |
          mkdir -p /tmp/components
          for d in /tmp/artifacts/*/; do
            cp "$d"*.tar.xz /tmp/components/ 2>/dev/null || true
          done
          ls -lh /tmp/components/
      - uses: actions/upload-artifact@v4
        with:
          name: all-components
          path: /tmp/components/
          retention-days: 90
