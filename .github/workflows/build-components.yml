name: Build Components

on:
  workflow_dispatch:
    inputs:
      components:
        description: 'Components to build (comma-separated: core,wine,box64,fex,turnip,rootfs,all)'
        type: string
        default: 'all'

env:
  ANDROID_PLATFORM: '28'
  ARCH: 'aarch64'

jobs:
  # ============================================================
  # Core: 运行时库 (libc++, X11, PulseAudio, Zink, libredirect, libandroid-sysvshm)
  # ============================================================
  core:
    name: Build Core (runtime libs)
    if: ${{ contains(inputs.components, 'core') || contains(inputs.components, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip meson ninja-build pkg-config autoconf automake libtool \
            xutils-dev libxcb1-dev libx11-dev bison flex gettext
          pip3 install --user meson mako jinja2 pyyaml
      - name: Build libX11 + libXtst + libxcb
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export NDK=${ANDROID_NDK_HOME}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_PLATFORM}-clang
          export CXX=$CC++
          export AR=$TOOLCHAIN/bin/aarch64-linux-android-ar
          export PKG_CONFIG_PATH=/tmp/core-install/lib/pkgconfig
          export CFLAGS="-fPIC -O2"
          mkdir -p /tmp/core-build /tmp/core-install
          for lib in libxau libxcb libx11 libxtst; do
            case $lib in
              libxau) URL="https://gitlab.freedesktop.org/xorg/lib/libxau.git" ;;
              libxcb) URL="https://gitlab.freedesktop.org/xorg/lib/libxcb.git" ;;
              libx11) URL="https://gitlab.freedesktop.org/xorg/lib/libx11.git" ;;
              libxtst) URL="https://gitlab.freedesktop.org/xorg/lib/libxtst.git" ;;
            esac
            git clone --depth 1 "$URL" "/tmp/core-build/$lib"
            cd "/tmp/core-build/$lib"
            ./autogen.sh --host=aarch64-linux-android --prefix=/tmp/core-install \
              --enable-static --disable-shared
            make -j$(nproc) && make install
          done
      - name: Build libredirect.so (LD_PRELOAD path redirector)
        run: |
          export NDK=${ANDROID_NDK_HOME}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_PLATFORM}-clang
          mkdir -p /tmp/core-install/usr/lib
          cat > /tmp/redirect.c <<'CEOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <string.h>
          #include <stdlib.h>
          #include <stdio.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <stdarg.h>
          static const char *IMAGEFS = NULL;
          static int initialized = 0;
          static void init() {
              if (initialized) return;
              IMAGEFS = getenv("WINFEX_IMAGEFS");
              if (!IMAGEFS) IMAGEFS = "/data/data/com.winfex/files/imagefs";
              initialized = 1;
          }
          static const char* redirect_path(const char *path) {
              static __thread char buf[4096];
              if (!path) return path;
              init();
              if (strncmp(path, "/usr/", 5) == 0) { snprintf(buf, sizeof(buf), "%s/usr/%s", IMAGEFS, path + 5); return buf; }
              if (strncmp(path, "/etc/", 5) == 0) { snprintf(buf, sizeof(buf), "%s/etc/%s", IMAGEFS, path + 5); return buf; }
              if (strncmp(path, "/lib/", 5) == 0) { snprintf(buf, sizeof(buf), "%s/usr/lib/%s", IMAGEFS, path + 5); return buf; }
              if (strncmp(path, "/lib64/", 7) == 0) { snprintf(buf, sizeof(buf), "%s/usr/lib/%s", IMAGEFS, path + 7); return buf; }
              return path;
          }
          typedef int (*orig_open_t)(const char*, int, ...);
          typedef int (*orig_openat_t)(int, const char*, int, ...);
          typedef int (*orig_stat_t)(const char*, struct stat*);
          typedef int (*orig_access_t)(const char*, int);
          int open(const char *path, int flags, ...) {
              static orig_open_t orig = NULL;
              if (!orig) orig = (orig_open_t)dlsym(RTLD_NEXT, "open");
              const char *p = redirect_path(path);
              if (flags & O_CREAT) { va_list args; va_start(args, flags); mode_t mode = va_arg(args, mode_t); va_end(args); return orig(p, flags, mode); }
              return orig(p, flags);
          }
          int openat(int dirfd, const char *path, int flags, ...) {
              static orig_openat_t orig = NULL;
              if (!orig) orig = (orig_openat_t)dlsym(RTLD_NEXT, "openat");
              const char *p = redirect_path(path);
              if (flags & O_CREAT) { va_list args; va_start(args, flags); mode_t mode = va_arg(args, mode_t); va_end(args); return orig(dirfd, p, flags, mode); }
              return orig(dirfd, p, flags);
          }
          int stat(const char *path, struct stat *buf) {
              static orig_stat_t orig = NULL;
              if (!orig) orig = (orig_stat_t)dlsym(RTLD_NEXT, "stat");
              return orig(redirect_path(path), buf);
          }
          int access(const char *path, int mode) {
              static orig_access_t orig = NULL;
              if (!orig) orig = (orig_access_t)dlsym(RTLD_NEXT, "access");
              return orig(redirect_path(path), mode);
          }
          CEOF
          $CC -shared -fPIC -O2 -o /tmp/core-install/usr/lib/libredirect.so /tmp/redirect.c -ldl
          chmod 755 /tmp/core-install/usr/lib/libredirect.so
      - name: Copy libc++_shared.so
        run: |
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so \
             /tmp/core-install/usr/lib/
      - name: Package Core tar.xz
        run: |
          mkdir -p /tmp/core-package/usr/lib /tmp/core-package/usr/bin /tmp/core-package/etc
          cp -r /tmp/core-install/lib /tmp/core-package/usr/ 2>/dev/null || true
          cp -r /tmp/core-install/usr/lib /tmp/core-package/usr/ 2>/dev/null || true
          find /tmp/core-package -name '*.a' -delete
          find /tmp/core-package -name '*.la' -delete
          cd /tmp/core-package
          tar -cJf /tmp/core-aarch64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: core-aarch64
          path: /tmp/core-aarch64.tar.xz
          retention-days: 30

  # ============================================================
  # Wine: ARM64EC 原生编译（直接执行，FEX 通过 HODLL DLL 翻译 x86 PE）
  # ============================================================
  wine:
    name: Build Wine (ARM64EC)
    if: ${{ contains(inputs.components, 'wine') || contains(inputs.components, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flex bison gcc-multilib g++-multilib \
            libfreetype-dev libgl-dev libx11-dev libxext-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcomposite-dev libgstreamer1.0-dev \
            libpulse-dev libgnutls28-dev libxcursor-dev \
            libxi-dev libxxf86vm-dev libxfixes-dev
      - name: Clone Wine
        run: git clone --depth 1 --branch wine-9.0 https://gitlab.winehq.org/wine/wine.git /tmp/wine-src
      - name: Build Wine for ARM64 (bionic, ARM64EC)
        run: |
          export NDK=${ANDROID_NDK_HOME}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_PLATFORM}-clang
          export CXX=$CC++
          export AR=$TOOLCHAIN/bin/aarch64-linux-android-ar
          export RANLIB=$TOOLCHAIN/bin/aarch64-linux-android-ranlib
          export CFLAGS="-fPIC -O2 -D__ANDROID__ -Wno-error"
          export CXXFLAGS="$CFLAGS"
          cd /tmp/wine-src
          ./configure \
            --host=aarch64-linux-android \
            --prefix=/tmp/wine-install/wine \
            --enable-archs=arm64ec,aarch64,i386,x86_64 \
            --without-oss --disable-winemenubuilder --disable-win16 --disable-tests \
            --with-x --with-pulse --with-gstreamer --with-opengl --with-gnutls \
            --without-sdl --without-wayland --without-cups --without-usb \
            --without-netapi --without-pcap --without-v4l2 --without-opencl \
            --without-dbus --without-sane --without-udev
          make -j$(nproc)
          make install
      - name: Package Wine tar.xz
        run: |
          cd /tmp/wine-install
          tar -cJf /tmp/wine-arm64ec.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: wine-arm64ec
          path: /tmp/wine-arm64ec.tar.xz
          retention-days: 30

  # ============================================================
  # Box64: x86_64 → ARM64 翻译器（辅助，ARM64EC 不可用时回退）
  # ============================================================
  box64:
    name: Build Box64
    if: ${{ contains(inputs.components, 'box64') || contains(inputs.components, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"
      - name: Clone Box64
        run: git clone --depth 1 https://github.com/ptitSeb/box64.git /tmp/box64-src
      - name: Build Box64
        run: |
          export NDK=${ANDROID_NDK_HOME}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_PLATFORM}-clang
          export CXX=$CC++
          mkdir -p /tmp/box64-build && cd /tmp/box64-build
          cmake /tmp/box64-src \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DANDROID=1 -DBAD_SIGNAL=1 -DARM_DYNAREC=ON \
            -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_INSTALL_PREFIX=/tmp/box64-install
          make -j$(nproc) && make install
      - name: Package Box64 tar.xz
        run: cd /tmp/box64-install && tar -cJf /tmp/box64-aarch64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: box64-aarch64
          path: /tmp/box64-aarch64.tar.xz
          retention-days: 30

  # ============================================================
  # FEX-Emu: 编译为 Windows DLL (libwow64fex.dll / libarm64ecfex.dll)
  # 被 Wine 的 WoW64/ARM64EC 层进程内加载，不需要 binfmt_misc / FEXLoader / root
  # ============================================================
  fex:
    name: Build FEX-Emu (DLL mode)
    if: ${{ contains(inputs.components, 'fex') || contains(inputs.components, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW + build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang llvm-dev libssl-dev \
            python3 python3-pip mingw-w64
          pip3 install --user mako jinja2 pyyaml
      - name: Clone FEX-Emu
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/FEX-Emu/FEX.git /tmp/fex-src
      - name: Build FEX as WoW64 DLL (libwow64fex.dll)
        run: |
          mkdir -p /tmp/fex-build-dll32 && cd /tmp/fex-build-dll32
          cmake /tmp/fex-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fex-src/Toolchain/Linux/aarch64-w64-mingw32.cmake \
            -DCMAKE_INSTALL_PREFIX=/tmp/fex-install \
            -DENABLE_JIT=ON -DBUILD_TESTS=OFF -DBUILD_THUNKS=OFF \
            -DFEX_WOW64=ON
          make -j$(nproc) wow64fex
          mkdir -p /tmp/fex-install/system32
          cp bin/libwow64fex.dll /tmp/fex-install/system32/
      - name: Build FEX as ARM64EC DLL (libarm64ecfex.dll)
        run: |
          mkdir -p /tmp/fex-build-dll64 && cd /tmp/fex-build-dll64
          cmake /tmp/fex-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/fex-src/Toolchain/Linux/arm64ec-w64-mingw32.cmake \
            -DCMAKE_INSTALL_PREFIX=/tmp/fex-install \
            -DENABLE_JIT=ON -DBUILD_TESTS=OFF -DBUILD_THUNKS=OFF \
            -DFEX_ARM64EC=ON
          make -j$(nproc) arm64ecfex
          mkdir -p /tmp/fex-install/system32
          cp bin/libarm64ecfex.dll /tmp/fex-install/system32/
      - name: Create FEX config
        run: |
          mkdir -p /tmp/fex-install/etc/fex-emu
          cat > /tmp/fex-install/etc/fex-emu/DefaultConfig.json <<'EOF'
          { "Config": { "TSOEnabled": true, "Multiblock": true, "VectorTSOEnabled": true, "HalfBarrierTSOEnabled": true } }
          EOF
      - name: Package FEX tar.xz
        run: cd /tmp/fex-install && tar -cJf /tmp/fex-aarch64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: fex-aarch64
          path: /tmp/fex-aarch64.tar.xz
          retention-days: 30

  # ============================================================
  # Turnip: Mesa Vulkan freedreno 驱动
  # ============================================================
  turnip:
    name: Build Turnip Driver
    if: ${{ contains(inputs.components, 'turnip') || contains(inputs.components, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip meson ninja-build glslang-tools libdrm-dev
          pip3 install --user meson mako pyyaml
      - name: Clone Mesa
        run: git clone --depth 1 --branch mesa-24.1.0 https://gitlab.freedesktop.org/mesa/mesa.git /tmp/mesa-src
      - name: Build Turnip
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export NDK=${ANDROID_NDK_HOME}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_PLATFORM}-clang
          export CXX=$CC++
          export CFLAGS="-fPIC -O2 -D__ANDROID__"
          cd /tmp/mesa-src
          # 用交叉编译配置文件
          cat > /tmp/meson-cross.ini <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '${TOOLCHAIN}/bin/aarch64-linux-android-ar'
          strip = '${TOOLCHAIN}/bin/aarch64-linux-android-strip'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          meson setup /tmp/mesa-build --prefix=/tmp/turnip-install \
            --cross-file /tmp/meson-cross.ini \
            -Dgallium-drivers= -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl -Dglvnd=disabled -Dplatforms= \
            -Dllvm=disabled -Dopengl=false -Degl=disabled -Dzstd=enabled
          meson compile -C /tmp/mesa-build
          meson install -C /tmp/mesa-build
      - name: Create Vulkan ICD JSON
        run: |
          mkdir -p /tmp/turnip-install/etc/vulkan
          cat > /tmp/turnip-install/etc/vulkan/vulkan_icd.json <<'EOF'
          { "ICD": { "api_version": "1.3.296", "library_path": "/data/data/com.winfex/files/imagefs/usr/lib/libvulkan_freedreno.so" }, "file_format_version": "1.0.0" }
          EOF
      - name: Package Turnip tar.xz
        run: cd /tmp/turnip-install && tar -cJf /tmp/turnip-aarch64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: turnip-aarch64
          path: /tmp/turnip-aarch64.tar.xz
          retention-days: 30

  # ============================================================
  # RootFS: 基础目录结构（无 root，纯文件解压 + 环境变量重定向）
  # ============================================================
  rootfs:
    name: Build RootFS
    if: ${{ contains(inputs.components, 'rootfs') || contains(inputs.components, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create RootFS structure
        run: |
          mkdir -p /tmp/rootfs/{usr/{bin,lib,share,etc,tmp,var},opt,home/xuser,etc/{fonts,xdg,tls},tmp,run,dev/input}
          echo 'root:x:0:0:root:/home:/bin/sh' > /tmp/rootfs/etc/passwd
          echo 'xuser:x:1000:1000:xuser:/home/xuser:/bin/sh' >> /tmp/rootfs/etc/passwd
          echo 'root:x:0:' > /tmp/rootfs/etc/group
          echo 'xuser:x:1000:' >> /tmp/rootfs/etc/group
          echo '127.0.0.1 localhost' > /tmp/rootfs/etc/hosts
          echo 'nameserver 8.8.8.8' > /tmp/rootfs/etc/resolv.conf
          echo 'nameserver 8.8.4.4' >> /tmp/rootfs/etc/resolv.conf
          # 基本目录
          mkdir -p /tmp/rootfs/home/xuser/.wine /tmp/rootfs/home/xuser/.cache /tmp/rootfs/home/xuser/.fex-emu
      - name: Package RootFS tar.xz
        run: cd /tmp/rootfs && tar -cJf /tmp/rootfs-aarch64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-aarch64
          path: /tmp/rootfs-aarch64.tar.xz
          retention-days: 30

  # ============================================================
  # 打包所有组件
  # ============================================================
  package-assets:
    name: Package All Assets
    needs: [core, wine, box64, fex, turnip, rootfs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
      - name: Organize
        run: |
          mkdir -p /tmp/assets/components
          for dir in /tmp/artifacts/*/; do
              cp "$dir"*.tar.xz /tmp/assets/components/ 2>/dev/null || true
          done
          ls -lh /tmp/assets/components/
      - uses: actions/upload-artifact@v4
        with:
          name: all-components
          path: /tmp/assets/components/
          retention-days: 90
