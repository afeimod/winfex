name: Build Components

# 这个 workflow 从开源项目下载预编译的 ARM64 二进制，打包成 tar.xz
# 放到 assets/components/ 目录
#
# 来源：
#   - Wine ARM64EC: MiceWine RootFS Generator 或 WinNative-Emu
#   - Box64: ptitSeb/box64 releases (Android ARM64)
#   - FEX DLL: FEX-Emu/FEX releases (MinGW DLL)
#   - Turnip: Mesa builds / Adrenotools
#   - Core libs: MiceWine RootFS
#   - RootFS: 本脚本生成基础结构

on:
  workflow_dispatch:
    inputs:
      download_all:
        description: 'Download all prebuilt components'
        type: boolean
        default: true

jobs:
  download-and-package:
    name: Download Prebuilt Components
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xz-utils wget curl

      - name: Create output directory
        run: mkdir -p /tmp/components

      # ===== RootFS: 基础目录结构 =====
      - name: Build RootFS
        run: |
          mkdir -p /tmp/rootfs/{usr/{bin,lib,share,etc,tmp,var},opt,home/xuser,etc/{fonts,xdg,tls},tmp,run,dev/input}
          echo 'root:x:0:0:root:/home:/bin/sh' > /tmp/rootfs/etc/passwd
          echo 'xuser:x:1000:1000:xuser:/home/xuser:/bin/sh' >> /tmp/rootfs/etc/passwd
          echo 'root:x:0:' > /tmp/rootfs/etc/group
          echo 'xuser:x:1000:' >> /tmp/rootfs/etc/group
          echo '127.0.0.1 localhost' > /tmp/rootfs/etc/hosts
          echo 'nameserver 8.8.8.8' > /tmp/rootfs/etc/resolv.conf
          mkdir -p /tmp/rootfs/home/xuser/.wine /tmp/rootfs/home/xuser/.cache /tmp/rootfs/home/xuser/.fex-emu
          cd /tmp/rootfs
          tar -cJf /tmp/components/rootfs-aarch64.tar.xz .

      # ===== Core: 从 MiceWine 下载 =====
      - name: Download Core libs from MiceWine
        run: |
          # MiceWine 的 RootFS 包含 Core 运行时库
          # 从 https://github.com/KreitinnSoftware/MiceWine-RootFS-Generator/releases 下载
          mkdir -p /tmp/core-pkg
          # 尝试下载 MiceWine Packages
          wget -q "https://github.com/KreitinnSoftware/MiceWine-RootFS-Generator/releases/latest/download/MiceWine-Packages.zip" -O /tmp/micewine.zip || true
          if [ -f /tmp/micewine.zip ] && [ -s /tmp/micewine.zip ]; then
            cd /tmp/core-pkg
            unzip -q /tmp/micewine.zip
            # 找 Core 包
            for f in Core-*.rat; do
              if [ -f "$f" ]; then
                # .rat 是 tar.xz，直接重命名
                cp "$f" /tmp/components/core-aarch64.tar.xz
                echo "Core: extracted from MiceWine $f"
                break
              fi
            done
          fi
          # 如果没下载到，生成最小 stub
          if [ ! -f /tmp/components/core-aarch64.tar.xz ]; then
            echo "WARNING: MiceWine download failed, creating minimal core stub"
            mkdir -p /tmp/core-stub/usr/lib
            # libredirect.so stub
            cat > /tmp/stub.c <<'EOF'
            // minimal stub — replace with real libredirect.so
            EOF
            gcc -shared -fPIC -o /tmp/core-stub/usr/lib/libredirect.so /tmp/stub.c -ldl 2>/dev/null || true
            cd /tmp/core-stub
            tar -cJf /tmp/components/core-aarch64.tar.xz .
          fi

      # ===== Box64: 从 GitHub Release 下载 =====
      - name: Download Box64
        run: |
          mkdir -p /tmp/box64-pkg/usr/bin
          # Box64 Android ARM64 预编译
          BOX64_URL=$(curl -sL "https://api.github.com/repos/ptitSeb/box64/releases/latest" \
            | grep "browser_download_url" \
            | grep -i "android\|aarch64\|arm64" \
            | head -1 \
            | cut -d'"' -f4)
          if [ -n "$BOX64_URL" ]; then
            echo "Downloading Box64 from: $BOX64_URL"
            wget -q "$BOX64_URL" -O /tmp/box64.tar.gz
            cd /tmp/box64-pkg
            tar -xf /tmp/box64.tar.gz
            # 找 box64 可执行文件
            find . -name "box64" -type f -executable | head -1 | xargs -I{} cp {} usr/bin/
            chmod 755 usr/bin/box64
          fi
          # 如果没下载到，从源码编译
          if [ ! -f /tmp/box64-pkg/usr/bin/box64 ]; then
            echo "Downloading Box64 source and compiling..."
            sudo apt-get install -y cmake
            git clone --depth 1 https://github.com/ptitSeb/box64.git /tmp/box64-src
            mkdir -p /tmp/box64-build && cd /tmp/box64-build
            # 用系统 GCC 编译 ARM64（GitHub runner 是 x86_64，需要交叉编译）
            # 简化：直接下载 Android NDK
            wget -q "https://dl.google.com/android/repository/android-ndk-r27b-linux.zip" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d /tmp/ndk
            NDK_DIR=$(ls -d /tmp/ndk/android-ndk-r*)
            export CC=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang
            export CXX=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++
            cmake /tmp/box64-src \
              -DCMAKE_BUILD_TYPE=Release -DANDROID=1 -DBAD_SIGNAL=1 -DARM_DYNAREC=ON \
              -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX \
              -DCMAKE_INSTALL_PREFIX=/tmp/box64-pkg
            make -j$(nproc) box64
            cp box64 /tmp/box64-pkg/usr/bin/
            chmod 755 /tmp/box64-pkg/usr/bin/box64
          fi
          cd /tmp/box64-pkg
          tar -cJf /tmp/components/box64-aarch64.tar.xz .

      # ===== Turnip: 从 Adrenotools 下载 =====
      - name: Download Turnip driver
        run: |
          mkdir -p /tmp/turnip-pkg/usr/lib /tmp/turnip-pkg/etc/vulkan
          # 从 Adrenotools 下载预编译 Turnip
          TURNIP_URL=$(curl -sL "https://api.github.com/repos/K11MCH1/AdrenoToolsDrivers/releases/latest" \
            | grep "browser_download_url" \
            | grep -i "turnip\|freedreno\|mesa" \
            | head -1 \
            | cut -d'"' -f4)
          if [ -n "$TURNIP_URL" ]; then
            echo "Downloading Turnip from: $TURNIP_URL"
            wget -q "$TURNIP_URL" -O /tmp/turnip.zip
            cd /tmp/turnip-pkg/usr/lib
            unzip -qo /tmp/turnip.zip
          fi
          # 生成 ICD JSON
          cat > /tmp/turnip-pkg/etc/vulkan/vulkan_icd.json <<'EOF'
          { "ICD": { "api_version": "1.3.296", "library_path": "/data/data/com.winfex/files/imagefs/usr/lib/libvulkan_freedreno.so" }, "file_format_version": "1.0.0" }
          EOF
          cd /tmp/turnip-pkg
          tar -cJf /tmp/components/turnip-aarch64.tar.xz .

      # ===== FEX DLL: 从 FEX-Emu Release 下载 =====
      - name: Download FEX DLLs
        run: |
          mkdir -p /tmp/fex-pkg/system32 /tmp/fex-pkg/etc/fex-emu
          # FEX 的 Windows DLL 在 Release 里
          FEX_URL=$(curl -sL "https://api.github.com/repos/FEX-Emu/FEX/releases/latest" \
            | grep "browser_download_url" \
            | grep -i "wow64\|arm64ec\|mingw\|dll" \
            | head -1 \
            | cut -d'"' -f4)
          if [ -n "$FEX_URL" ]; then
            echo "Downloading FEX from: $FEX_URL"
            wget -q "$FEX_URL" -O /tmp/fex.tar.gz
            cd /tmp/fex-pkg
            tar -xf /tmp/fex.tar.gz
            # 找 DLL 文件
            find . -name "libwow64fex.dll" -exec cp {} system32/ \; 2>/dev/null || true
            find . -name "libarm64ecfex.dll" -exec cp {} system32/ \; 2>/dev/null || true
          fi
          # 生成配置
          cat > /tmp/fex-pkg/etc/fex-emu/DefaultConfig.json <<'EOF'
          { "Config": { "TSOEnabled": true, "Multiblock": true } }
          EOF
          cd /tmp/fex-pkg
          tar -cJf /tmp/components/fex-aarch64.tar.xz .

      # ===== Wine: 从 MiceWine 或 WinNative 下载 =====
      - name: Download Wine
        run: |
          mkdir -p /tmp/wine-pkg/wine
          # 尝试从 MiceWine 下载
          if [ -f /tmp/micewine.zip ]; then
            cd /tmp/wine-pkg
            unzip -qo /tmp/micewine.zip -d /tmp/micewine-pkgs 2>/dev/null || true
            for f in /tmp/micewine-pkgs/Wine-*.rat; do
              if [ -f "$f" ]; then
                # .rat 是 tar.xz
                mkdir -p wine
                tar -xJf "$f" -C wine/
                echo "Wine: extracted from MiceWine $f"
                break
              fi
            done
          fi
          # 如果没下载到，创建 stub
          if [ ! -d /tmp/wine-pkg/wine/bin ]; then
            echo "WARNING: Wine download failed, creating stub"
            mkdir -p /tmp/wine-pkg/wine/bin
            echo '#!/system/bin/sh' > /tmp/wine-pkg/wine/bin/wine
            echo 'echo "Wine stub — replace with real ARM64EC Wine"' >> /tmp/wine-pkg/wine/bin/wine
            chmod 755 /tmp/wine-pkg/wine/bin/wine
          fi
          cd /tmp/wine-pkg
          tar -cJf /tmp/components/wine-arm64ec.tar.xz .

      # ===== 上传所有组件 =====
      - name: List components
        run: ls -lh /tmp/components/

      - uses: actions/upload-artifact@v4
        with:
          name: all-components
          path: /tmp/components/
          retention-days: 90
