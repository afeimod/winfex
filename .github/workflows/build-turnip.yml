name: Build Turnip Driver

# 构建 Mesa Turnip (freedreno) Vulkan 驱动
# 用于 Adreno GPU 的 Vulkan 支持
#
# RootFS 获取策略（按优先级）：
#   1. 从 GitHub Release 下载（推荐 —— 跨 run 可用，稳定可靠）
#   2. 从当前 workflow run 的 artifact 下载（fallback）

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (mesa-24.1.0 / mesa-25.1.4)'
        type: string
        default: 'mesa-25.1.4'
      rootfs_release_tag:
        description: 'Release tag for RootFS download (e.g. rootfs-latest)'
        type: string
        default: 'rootfs-latest'

env:
  NDK_URL: 'https://dl.google.com/android/repository/android-ndk-r29-linux.zip'
  ROOTFS_PREFIX: '/tmp/bionic-prefix'

jobs:
  build-turnip:
    name: Build Turnip (${{ inputs.mesa_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip meson ninja-build pkg-config \
            glslang-tools libdrm-dev cmake \
            unzip ca-certificates xz-utils
          sudo pip3 install --upgrade --ignore-installed meson mako pyyaml jinja2

      # ============================================================
      # NDK 下载 + 验证 + 创建通用名符号链接
      # ============================================================
      - name: Setup NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" -O /tmp/ndk.zip
          rm -rf /tmp/ndk-tmp /tmp/ndk
          mkdir -p /tmp/ndk-tmp
          unzip -q /tmp/ndk.zip -d /tmp/ndk-tmp
          NDK_EXTRACTED=$(ls -d /tmp/ndk-tmp/android-ndk-* | head -1)
          echo "NDK extracted to: $NDK_EXTRACTED"
          mkdir -p /tmp/ndk
          cp -a "$NDK_EXTRACTED/." /tmp/ndk/

          TC="/tmp/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG=$(find "$TC/bin/" -name "aarch64-linux-android*-clang" ! -name "*++*" | head -1)
          echo "Found clang: $CLANG"

          ln -sf "$CLANG" "$TC/bin/aarch64-linux-android-clang"
          ln -sf "${CLANG}++" "$TC/bin/aarch64-linux-android-clang++"
          ln -sf "$TC/bin/llvm-ar" "$TC/bin/aarch64-linux-android-ar"
          ln -sf "$TC/bin/llvm-ranlib" "$TC/bin/aarch64-linux-android-ranlib"
          ln -sf "$TC/bin/llvm-strip" "$TC/bin/aarch64-linux-android-strip"
          ln -sf "$TC/bin/llvm-nm" "$TC/bin/aarch64-linux-android-nm"
          echo "NDK setup complete"

      # ============================================================
      # 下载 RootFS —— 优先从 GitHub Release 下载
      # ============================================================
      - name: Download RootFS from GitHub Release
        id: download_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.rootfs_release_tag }}"
          REPO="${{ github.repository }}"
          echo "Trying to download RootFS from release '$TAG' on $REPO"
          mkdir -p /tmp/rootfs-download
          if gh release download "$TAG" --repo "$REPO" \
              --pattern "rootfs-aarch64.tar.xz" \
              --output /tmp/rootfs-download/rootfs-aarch64.tar.xz 2>/dev/null; then
            echo "Downloaded from release."
            ls -lh /tmp/rootfs-download/rootfs-aarch64.tar.xz
            echo "rootfs_source=release" >> $GITHUB_ENV
          else
            echo "Release '$TAG' not found or download failed."
          fi

      - name: Fallback - Download RootFS from workflow artifact
        if: ${{ steps.download_release.outcome != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rootfs-aarch64
          path: /tmp/rootfs-download
        continue-on-error: true

      - name: Extract RootFS
        run: |
          if [ -f /tmp/rootfs-download/rootfs-aarch64.tar.xz ]; then
            mkdir -p ${{ env.ROOTFS_PREFIX }}
            cd ${{ env.ROOTFS_PREFIX }}
            tar -xf /tmp/rootfs-download/rootfs-aarch64.tar.xz
            echo "RootFS extracted. Source: ${{ env.rootfs_source || 'artifact-fallback' }}"
            echo "Total .so files: $(find ${{ env.ROOTFS_PREFIX }}/lib -name '*.so' 2>/dev/null | wc -l)"
          else
            echo "WARNING: RootFS not found. Creating minimal prefix."
            mkdir -p ${{ env.ROOTFS_PREFIX }}/{lib,include,share}
          fi

      # ============================================================
      # 设置 NDK 环境变量 + 应用 NDK 补丁
      # ============================================================
      - name: Set NDK environment and apply patches
        run: |
          NDK="/tmp/ndk"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG="$TC/bin/aarch64-linux-android-clang"
          if [ ! -x "$CLANG" ]; then
            echo "ERROR: clang not found at $CLANG"
            exit 1
          fi
          echo "CC=$CLANG" >> $GITHUB_ENV
          echo "CXX=${CLANG}++" >> $GITHUB_ENV
          echo "AR=$TC/bin/llvm-ar" >> $GITHUB_ENV
          echo "STRIP=$TC/bin/llvm-strip" >> $GITHUB_ENV
          echo "NM=$TC/bin/llvm-nm" >> $GITHUB_ENV
          echo "SYSROOT=$TC/sysroot" >> $GITHUB_ENV
          echo "NDK=$NDK" >> $GITHUB_ENV
          echo "PATH=$TC/bin:$PATH" >> $GITHUB_ENV
          echo "Found clang: $CLANG"

          cd ${{ github.workspace }}/scripts
          NDK_SYSROOT="${{ env.SYSROOT }}"
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          for _patch in ndk_patches/r29/*.patch; do
            [ -f "$_patch" ] || continue
            cd "$NDK_SYSROOT"
            if patch -p1 --dry-run <"$OLDPWD/$_patch" >/dev/null 2>&1; then
              patch --no-backup-if-mismatch -N -p1 <<<"$(cat "$OLDPWD/$_patch" | sed "s|@TERMUX_PREFIX@|${PREFIX}|g" | sed "s|@TERMUX_PREFIX_CLASSICAL@|${PREFIX}|g" | sed "s|@ROOTFS_PREFIX@|${PREFIX}|g" | sed "s|__TERMUX__|__ANDROID__|g")" || true
            fi
            cd -
          done
          echo "NDK patches applied"

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch ${{ inputs.mesa_version }} https://gitlab.freedesktop.org/mesa/mesa.git /tmp/mesa-src

      - name: Create meson cross file
        run: |
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          cat > /tmp/cross-aarch64-android.ini << EOF
          [binaries]
          c = '${{ env.CC }}'
          cpp = '${{ env.CXX }}'
          ar = '${{ env.AR }}'
          strip = '${{ env.STRIP }}'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [built-in options]
          c_args = ['-fPIC', '-O2', '-I${PREFIX}/include']
          cpp_args = ['-fPIC', '-O2', '-I${PREFIX}/include']
          c_link_args = ['-L${PREFIX}/lib']
          cpp_link_args = ['-L${PREFIX}/lib']

          [properties]
          needs_exe_wrapper = true
          EOF
          cat /tmp/cross-aarch64-android.ini

      - name: Build Turnip (vulkan-freedreno)
        run: |
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig"
          # 关键：不要加 -D__ANDROID__
          # Mesa 源码在 __ANDROID__ 定义时会 #include Android 系统头文件
          # (cutils/trace.h, log/log.h 等)，这些在 NDK r29 中已移除。
          # Turnip 驱动通过 KGSL/MSM 内核 ioctl 与 GPU 通信，不需要 Android API。
          export CFLAGS="-fPIC -O2 -I${PREFIX}/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L${PREFIX}/lib"

          cd /tmp/mesa-src
          # 删除可能存在的 Termux-patched libarchive 源码
          rm -rf subprojects/libarchive-3.*/
          rm -rf subprojects/packagecache/libarchive-*

          # 禁用 libarchive 所有可选依赖 + 禁用 zstd
          # libarchive 3.7.2 valid options: zlib, bz2lib, libb2, iconv, lz4, zstd,
          # lzma, lzo2, openssl, xml2, expat, regex, xattr, acl
          meson setup /tmp/mesa-build \
            --prefix=${PREFIX} \
            --cross-file /tmp/cross-aarch64-android.ini \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dglvnd=disabled \
            -Dplatforms= \
            -Dllvm=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dzstd=disabled \
            -Dshader-cache=disabled \
            -Dlibarchive:openssl=disabled \
            -Dlibarchive:xml2=disabled \
            -Dlibarchive:expat=disabled \
            -Dlibarchive:iconv=disabled \
            -Dlibarchive:libb2=disabled \
            -Dlibarchive:regex=disabled \
            -Dlibarchive:lz4=disabled \
            -Dlibarchive:zstd=disabled \
            -Dlibarchive:lzma=disabled \
            -Dlibarchive:lzo2=disabled \
            -Dlibarchive:bz2lib=disabled \
            -Dlibarchive:zlib=disabled \
            -Dlibarchive:xattr=disabled \
            -Dlibarchive:acl=disabled

          meson compile -C /tmp/mesa-build
          meson install -C /tmp/mesa-build

      - name: Create Vulkan ICD JSON
        run: |
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          mkdir -p ${PREFIX}/etc/vulkan
          cat > ${PREFIX}/etc/vulkan/vulkan_icd.json << EOF
          {
            "ICD": {
              "api_version": "1.3.296",
              "library_path": "/data/data/com.winfex/files/imagefs/lib/libvulkan_freedreno.so"
            },
            "file_format_version": "1.0.0"
          }
          EOF

      - name: Package Turnip
        run: |
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          mkdir -p /tmp/turnip-pkg/lib /tmp/turnip-pkg/etc/vulkan
          cp ${PREFIX}/lib/libvulkan_freedreno.so /tmp/turnip-pkg/lib/ 2>/dev/null || true
          cp ${PREFIX}/lib/libvulkan_*_so* /tmp/turnip-pkg/lib/ 2>/dev/null || true
          cp ${PREFIX}/etc/vulkan/vulkan_icd.json /tmp/turnip-pkg/etc/vulkan/
          cd /tmp/turnip-pkg
          tar -cJf /tmp/turnip-aarch64.tar.xz .
          ls -lh /tmp/turnip-aarch64.tar.xz
          echo "Contents:"
          find . -type f -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: turnip-aarch64
          path: /tmp/turnip-aarch64.tar.xz
          retention-days: 30
