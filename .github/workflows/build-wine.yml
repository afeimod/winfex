name: Build Wine (ARM64 WOW64)

# 构建 ARM64 原生 Wine，支持 WOW64（通过 FEX/Box64 DLL 翻译 x86 PE）
# 产出两种版本：
#   1. wine-wow64-arm64     — 普通版 Wine（从 winehq.org 源码）
#   2. proton-wow64-arm64   — Proton 版 Wine（从 ValveGitHub proton-wine）
#
# RootFS 获取策略（按优先级）：
#   1. 从 GitHub Release 下载（推荐 —— 跨 run 可用，稳定可靠）
#   2. 从当前 workflow run 的 artifact 下载（fallback）

on:
  workflow_dispatch:
    inputs:
      wine_version:
        description: 'Wine version (wine-9.0 / wine-10.0 / proton-9.0)'
        type: string
        default: 'wine-9.0'
      build_proton:
        description: 'Also build Proton variant'
        type: boolean
        default: true
      rootfs_release_tag:
        description: 'Release tag for RootFS download (e.g. rootfs-latest)'
        type: string
        default: 'rootfs-latest'

env:
  NDK_URL: 'https://dl.google.com/android/repository/android-ndk-r29-linux.zip'
  ROOTFS_PREFIX: '/tmp/bionic-prefix'

jobs:
  build-wine:
    name: Build Wine ${{ inputs.wine_version }} (ARM64 WOW64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flex bison gcc-multilib g++-multilib \
            libfreetype-dev libgl-dev libx11-dev libxext-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcomposite-dev libgstreamer1.0-dev \
            libpulse-dev libgnutls28-dev libxcursor-dev \
            libxi-dev libxxf86vm-dev libxfixes-dev \
            pkg-config autoconf automake libtool gettext \
            unzip ca-certificates xz-utils wget

          # 关键：系统 mingw-w64 不支持 arm64ec target
          # 必须用 llvm-mingw（基于 LLVM 的 MinGW，支持所有 Windows 架构包括 arm64ec）
          # 下载最新预编译版本（mstorsjo/llvm-mingw 提供 UCRT Ubuntu 版本）
          LLVM_MINGW_TAG=$(curl -sL "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest" | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "Using llvm-mingw tag: $LLVM_MINGW_TAG"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64.tar.xz" -O /tmp/llvm-mingw.tar.xz
          ls -lh /tmp/llvm-mingw.tar.xz
          mkdir -p /tmp/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C /tmp/llvm-mingw --strip-components=1
          # 添加到 PATH（让 Wine configure 能找到 arm64ec-w64-mingw32-clang）
          echo "/tmp/llvm-mingw/bin" >> $GITHUB_PATH
          # 验证 arm64ec 编译器存在
          echo "=== Verifying llvm-mingw compilers ==="
          ls /tmp/llvm-mingw/bin/aarch64-w64-mingw32-clang
          ls /tmp/llvm-mingw/bin/arm64ec-w64-mingw32-clang 2>/dev/null && echo "arm64ec-w64-mingw32-clang: OK" || echo "arm64ec-w64-mingw32 not found (Wine will use -target arm64ec-windows)"
          ls /tmp/llvm-mingw/bin/i686-w64-mingw32-clang
          ls /tmp/llvm-mingw/bin/x86_64-w64-mingw32-clang
          echo "LLVM_MINGW=/tmp/llvm-mingw" >> $GITHUB_ENV

      # ============================================================
      # NDK 下载 + 验证 + 创建通用名符号链接
      # ============================================================
      - name: Setup NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" -O /tmp/ndk.zip
          rm -rf /tmp/ndk-tmp /tmp/ndk
          mkdir -p /tmp/ndk-tmp
          unzip -q /tmp/ndk.zip -d /tmp/ndk-tmp
          NDK_EXTRACTED=$(ls -d /tmp/ndk-tmp/android-ndk-* | head -1)
          echo "NDK extracted to: $NDK_EXTRACTED"
          mkdir -p /tmp/ndk
          cp -a "$NDK_EXTRACTED/." /tmp/ndk/

          TC="/tmp/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG=$(find "$TC/bin/" -name "aarch64-linux-android*-clang" ! -name "*++*" | head -1)
          echo "Found clang: $CLANG"

          # 创建通用名称的符号链接（configure 用 --host=aarch64-linux-android 时会查找这些）
          ln -sf "$CLANG" "$TC/bin/aarch64-linux-android-clang"
          ln -sf "${CLANG}++" "$TC/bin/aarch64-linux-android-clang++"
          ln -sf "$TC/bin/llvm-ar" "$TC/bin/aarch64-linux-android-ar"
          ln -sf "$TC/bin/llvm-ranlib" "$TC/bin/aarch64-linux-android-ranlib"
          ln -sf "$TC/bin/llvm-strip" "$TC/bin/aarch64-linux-android-strip"
          ln -sf "$TC/bin/llvm-nm" "$TC/bin/aarch64-linux-android-nm"
          echo "NDK setup complete"

      # ============================================================
      # 下载 RootFS —— 优先从 GitHub Release 下载
      # ============================================================
      - name: Download RootFS from GitHub Release
        id: download_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.rootfs_release_tag }}"
          REPO="${{ github.repository }}"
          echo "Trying to download RootFS from release '$TAG' on $REPO"
          mkdir -p /tmp/rootfs-download
          if gh release download "$TAG" --repo "$REPO" \
              --pattern "rootfs-aarch64.tar.xz" \
              --output /tmp/rootfs-download/rootfs-aarch64.tar.xz 2>/dev/null; then
            echo "Downloaded from release."
            ls -lh /tmp/rootfs-download/rootfs-aarch64.tar.xz
            echo "rootfs_source=release" >> $GITHUB_ENV
          else
            echo "Release '$TAG' not found or download failed."
          fi

      - name: Fallback - Download RootFS from workflow artifact
        if: ${{ steps.download_release.outcome != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rootfs-aarch64
          path: /tmp/rootfs-download
        continue-on-error: true

      - name: Extract and verify RootFS
        run: |
          if [ ! -f /tmp/rootfs-download/rootfs-aarch64.tar.xz ]; then
            echo "=========================================================="
            echo "  FATAL: rootfs-aarch64.tar.xz not found"
            echo "=========================================================="
            echo "TO FIX:"
            echo "  1. Run 'Build Components' workflow with release_tag='rootfs-latest'"
            echo "  2. Re-run THIS 'Build Wine' workflow"
            echo "=========================================================="
            exit 1
          fi
          mkdir -p ${{ env.ROOTFS_PREFIX }}
          cd ${{ env.ROOTFS_PREFIX }}
          tar -xf /tmp/rootfs-download/rootfs-aarch64.tar.xz
          echo "RootFS extracted. Source: ${{ env.rootfs_source || 'artifact-fallback' }}"
          echo "Total .so files: $(find ${{ env.ROOTFS_PREFIX }}/lib -name '*.so' 2>/dev/null | wc -l)"
          echo "Key headers:"
          for hdr in X11/X.h pulse/pulseaudio.h gstreamer-1.0/gst/gst.h gnutls/gnutls.h; do
            if [ -f ${{ env.ROOTFS_PREFIX }}/include/$hdr ]; then
              echo "  [OK]   $hdr"
            else
              echo "  [MISS] $hdr"
            fi
          done

      # ============================================================
      # 设置 NDK 环境变量 + 应用 NDK 补丁
      # ============================================================
      - name: Set NDK environment and apply patches
        run: |
          NDK="/tmp/ndk"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG="$TC/bin/aarch64-linux-android-clang"
          if [ ! -x "$CLANG" ]; then
            echo "ERROR: clang not found at $CLANG"
            exit 1
          fi
          echo "CC=$CLANG" >> $GITHUB_ENV
          echo "CXX=${CLANG}++" >> $GITHUB_ENV
          echo "AR=$TC/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TC/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TC/bin/llvm-strip" >> $GITHUB_ENV
          echo "SYSROOT=$TC/sysroot" >> $GITHUB_ENV
          echo "NDK=$NDK" >> $GITHUB_ENV
          echo "PATH=$TC/bin:$PATH" >> $GITHUB_ENV
          echo "Found clang: $CLANG"

          # 应用 NDK 补丁
          cd ${{ github.workspace }}/scripts
          NDK_SYSROOT="${{ env.SYSROOT }}"
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          for _patch in ndk_patches/r29/*.patch; do
            [ -f "$_patch" ] || continue
            cd "$NDK_SYSROOT"
            if patch -p1 --dry-run <"$OLDPWD/$_patch" >/dev/null 2>&1; then
              patch --no-backup-if-mismatch -N -p1 <<<"$(cat "$OLDPWD/$_patch" | sed "s|@TERMUX_PREFIX@|${PREFIX}|g" | sed "s|@TERMUX_PREFIX_CLASSICAL@|${PREFIX}|g" | sed "s|@ROOTFS_PREFIX@|${PREFIX}|g" | sed "s|__TERMUX__|__ANDROID__|g")" || true
            fi
            cd -
          done
          echo "NDK patches applied"

      # ============================================================
      # 构建 Wine 普通版 (wine-wow64-arm64)
      # ============================================================
      - name: Clone Wine ${{ inputs.wine_version }}
        run: |
          WINE_VER="${{ inputs.wine_version }}"
          if [[ "$WINE_VER" == proton-* ]]; then
            git clone --depth 1 --branch "$WINE_VER" https://github.com/ValveSoftware/wine.git /tmp/wine-src
          else
            git clone --depth 1 --branch "$WINE_VER" https://gitlab.winehq.org/wine/wine.git /tmp/wine-src
          fi
          ls /tmp/wine-src/configure*

      - name: Build wine-tools (host)
        run: |
          cd /tmp/wine-src
          mkdir -p build-tools && cd build-tools
          # 关键：wine-tools 必须用 host GCC 编译（不是 NDK clang）
          # NDK clang 产生 ARM64 二进制，无法在 x86_64 host 上运行
          unset CC CXX AR RANLIB STRIP
          export CC=gcc
          export CXX=g++
          ../configure --enable-win64 --without-x
          make -j$(nproc) __tooldeps__ nls/all

      - name: Configure Wine (ARM64 WOW64)
        run: |
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          # 交叉编译：使用 NDK clang
          export CC="${{ env.CC }}"
          export CXX="${{ env.CXX }}"
          export AR="${{ env.AR }}"
          export RANLIB="${{ env.RANLIB }}"
          export CFLAGS="-fPIC -O2 -D__ANDROID__ -Wno-error -I${PREFIX}/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L${PREFIX}/lib -landroid-shmem"
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig"
          # MinGW 交叉编译器（用于 PE 编译，支持 arm64ec）
          export CROSS_CFLAGS="-target arm64ec-windows -fuse-ld=lld -Wl,-subsystem:console -Wl,-WX"
          export CROSSTARGET="arm64ec-windows"

          cd /tmp/wine-src
          mkdir -p build-arm64 && cd build-arm64

          ../configure \
            --host=aarch64-linux-android \
            --prefix=${PREFIX}/opt/wine-wow64-arm64 \
            --enable-archs=arm64ec,aarch64,i386,x86_64 \
            --with-wine-tools=/tmp/wine-src/build-tools \
            --without-oss \
            --disable-winemenubuilder \
            --disable-win16 \
            --disable-tests \
            --with-x \
            --x-libraries=${PREFIX}/lib \
            --x-includes=${PREFIX}/include \
            --with-pulse \
            --with-gstreamer \
            --with-opengl \
            --with-gnutls \
            --with-mingw \
            --enable-nls \
            --without-xshm \
            --without-xxf86vm \
            --without-osmesa \
            --without-usb \
            --without-sdl \
            --without-wayland \
            --without-cups \
            --without-netapi \
            --without-pcap \
            --without-gphoto \
            --without-v4l2 \
            --without-pcsclite \
            --without-opencl \
            --without-dbus \
            --without-sane \
            --without-udev

      - name: Build Wine
        run: |
          cd /tmp/wine-src/build-arm64
          make -j$(nproc)

      - name: Install Wine
        run: |
          cd /tmp/wine-src/build-arm64
          make install

      - name: Package Wine (wow64-arm64)
        run: |
          cd ${{ env.ROOTFS_PREFIX }}/opt/wine-wow64-arm64
          tar -cJf /tmp/wine-wow64-arm64.tar.xz .
          ls -lh /tmp/wine-wow64-arm64.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: wine-wow64-arm64
          path: /tmp/wine-wow64-arm64.tar.xz
          retention-days: 30

      # ============================================================
      # 构建 Proton 版 (proton-wow64-arm64)
      # ============================================================
      - name: Clone Proton Wine
        if: ${{ inputs.build_proton }}
        run: |
          git clone --depth 1 --branch proton-9.0 https://github.com/ValveSoftware/wine.git /tmp/proton-wine-src

      - name: Build Proton wine-tools (host)
        if: ${{ inputs.build_proton }}
        run: |
          cd /tmp/proton-wine-src
          mkdir -p build-tools && cd build-tools
          # 关键：wine-tools 必须用 host GCC 编译（不是 NDK clang）
          unset CC CXX AR RANLIB STRIP
          export CC=gcc
          export CXX=g++
          ../configure --enable-win64 --without-x
          make -j$(nproc) __tooldeps__ nls/all

      - name: Configure Proton Wine (ARM64 WOW64)
        if: ${{ inputs.build_proton }}
        run: |
          PREFIX="${{ env.ROOTFS_PREFIX }}"
          export CC="${{ env.CC }}"
          export CXX="${{ env.CXX }}"
          export AR="${{ env.AR }}"
          export RANLIB="${{ env.RANLIB }}"
          export CFLAGS="-fPIC -O2 -D__ANDROID__ -Wno-error -I${PREFIX}/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L${PREFIX}/lib -landroid-shmem"
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig"
          # MinGW 交叉编译器（用于 PE 编译，支持 arm64ec）
          export CROSS_CFLAGS="-target arm64ec-windows -fuse-ld=lld -Wl,-subsystem:console -Wl,-WX"
          export CROSSTARGET="arm64ec-windows"

          cd /tmp/proton-wine-src
          mkdir -p build-arm64 && cd build-arm64

          ../configure \
            --host=aarch64-linux-android \
            --prefix=${PREFIX}/opt/proton-wow64-arm64 \
            --enable-archs=arm64ec,aarch64,i386,x86_64 \
            --with-wine-tools=/tmp/proton-wine-src/build-tools \
            --without-oss \
            --disable-winemenubuilder \
            --disable-win16 \
            --disable-tests \
            --with-x \
            --x-libraries=${PREFIX}/lib \
            --x-includes=${PREFIX}/include \
            --with-pulse \
            --with-gstreamer \
            --with-opengl \
            --with-gnutls \
            --with-mingw \
            --enable-nls \
            --without-xshm \
            --without-xxf86vm \
            --without-osmesa \
            --without-usb \
            --without-sdl \
            --without-wayland \
            --without-cups \
            --without-netapi \
            --without-pcap \
            --without-gphoto \
            --without-v4l2 \
            --without-pcsclite \
            --without-opencl \
            --without-dbus \
            --without-sane \
            --without-udev

      - name: Build Proton Wine
        if: ${{ inputs.build_proton }}
        run: |
          cd /tmp/proton-wine-src/build-arm64
          make -j$(nproc)

      - name: Install Proton Wine
        if: ${{ inputs.build_proton }}
        run: |
          cd /tmp/proton-wine-src/build-arm64
          make install

      - name: Package Proton Wine
        if: ${{ inputs.build_proton }}
        run: |
          cd ${{ env.ROOTFS_PREFIX }}/opt/proton-wow64-arm64
          tar -cJf /tmp/proton-wow64-arm64.tar.xz .
          ls -lh /tmp/proton-wow64-arm64.tar.xz

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_proton }}
        with:
          name: proton-wow64-arm64
          path: /tmp/proton-wow64-arm64.tar.xz
          retention-days: 30
