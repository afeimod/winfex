name: Build

on:
  workflow_dispatch:
    inputs:
      sync_xserver:
        description: 'Run sync-xserver.sh to fetch Lorie DDX source'
        type: boolean
        default: true
      build_release:
        description: 'Also build release APK (signed with debug key)'
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release (requires a tag)'
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (e.g. v0.4.2). Required if create_release=true'
        type: string
        required: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  ANDROID_SDK_PLATFORM: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK: '26.1.10909125'   # r26b
  CMAKE_VERSION: '3.22.1'

jobs:
  # ============================================================
  # Job 1: 完整构建 —— 跑 sync-xserver.sh，含 Lorie DDX
  # 仅手动触发（workflow_dispatch）
  # ============================================================
  build:
    name: Build APK (full, manual)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-${{ env.ANDROID_SDK_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} ndk;${{ env.ANDROID_NDK }} cmake;${{ env.CMAKE_VERSION }}'

      - name: Install Linux build deps (for Lorie submodules)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip meson ninja-build \
            xutils-dev libxcb1-dev libx11-dev \
            bison flex
          pip3 install --user meson mako jinja2 pyyaml
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Cache termux-x11 source
        id: cache-x11
        uses: actions/cache@v4
        with:
          path: build/termux-x11
          key: termux-x11-${{ hashFiles('scripts/sync-xserver.sh') }}-v1

      - name: Sync X Server source (Lorie DDX)
        if: ${{ inputs.sync_xserver == true }}
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          chmod +x ./scripts/sync-xserver.sh
          ./scripts/sync-xserver.sh

      - name: Skip X Server sync (user opted out)
        if: ${{ inputs.sync_xserver != true }}
        run: |
          echo "::warning::sync_xserver=false, building with stub X server module"
          echo "Virtual keys / X server will not work in the resulting APK"
          ls xserver/src/main/cpp/ || true

      - name: Sync status summary
        if: always()
        run: |
          echo "## X Server sync summary"
          echo "- lorie files: $(find xserver/src/main/cpp/lorie -maxdepth 1 -type f 2>/dev/null | wc -l)"
          echo "- xserver submodule: $([ -d xserver/src/main/cpp/xserver ] && echo '✓ present' || echo '✗ missing')"
          echo "- pixman: $([ -d xserver/src/main/cpp/pixman ] && echo '✓' || echo '✗')"
          echo "- libxfont: $([ -d xserver/src/main/cpp/libxfont ] && echo '✓' || echo '✗')"
          echo "- patches: $(ls xserver/src/main/cpp/patches/ 2>/dev/null | wc -l)"
          echo "- recipes: $(ls xserver/src/main/cpp/recipes/ 2>/dev/null | wc -l)"
          echo "- AIDL: $(find xserver/src/main/aidl -name '*.aidl' 2>/dev/null | wc -l)"
          echo "- Java files: $(find xserver/src/main/java -name '*.java' -o -name '*.kt' 2>/dev/null | wc -l)"
          echo "- stub files: $(find xserver/src/main/java/com/winfex/xserver/stub -name '*.java' 2>/dev/null | wc -l)"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_release == true }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: List build outputs
        if: always()
        run: |
          echo "## Build outputs"
          find app/build/outputs -type f -name '*.apk' -exec ls -lh {} \; || true
          find xserver/build/outputs -type f \( -name '*.aar' -o -name '*.so' \) -exec ls -lh {} \; || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winfex-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: ${{ always() && inputs.build_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: winfex-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload xserver AAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xserver-aar
          path: xserver/build/outputs/aar/*.aar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            xserver/build/reports/
            **/build/reports/
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # Job 2: 创建 GitHub Release —— 仅当 inputs.create_release=true
  # ============================================================
  release:
    name: Publish Release
    needs: build
    if: ${{ inputs.create_release == true && inputs.build_release == true && inputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.tag_name }}" ]; then
            echo "::error::tag_name is required when create_release=true"
            exit 1
          fi
          echo "Releasing as tag: ${{ inputs.tag_name }}"
          echo "Prerelease: ${{ inputs.prerelease }}"

      - name: Checkout (for tag creation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          TAG="${{ inputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::tag $TAG already exists, skipping creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG (manual trigger by ${{ github.actor }})"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: winfex-release
          path: apks/

      - name: Download debug APK (附加)
        uses: actions/download-artifact@v4
        with:
          name: winfex-debug
          path: apks/debug/

      - name: Rename APKs with version
        run: |
          VERSION="${{ inputs.tag_name }}"
          cd apks
          for f in *.apk; do
            base="${f%.apk}"
            mv "$f" "winfex-${VERSION}-${base}.apk"
          done
          # debug 子目录
          if [ -d debug ]; then
            cd debug
            for f in *.apk; do
              base="${f%.apk}"
              mv "$f" "../winfex-${VERSION}-${base}.apk"
            done
            cd ..
            rmdir debug || true
          fi
          echo "## Final APK list"
          ls -lh *.apk

      - name: Generate release notes
        run: |
          VERSION="${{ inputs.tag_name }}"
          cat > release_body.md <<EOF
          ## Winfex $VERSION

          > 此 Release 由 @${{ github.actor }} 手动触发构建。

          ### 下载

          - \`winfex-${VERSION}-app-debug.apk\` — Debug 版（带 logcat 输出）
          - \`winfex-${VERSION}-app-release-unsigned.apk\` — Release 版（需自行签名）

          ### 安装

          \`\`\`bash
          adb install -r winfex-${VERSION}-app-debug.apk
          \`\`\`

          ### 注意事项

          - **此 APK 已内置 Lorie X Server**（DISPLAY=:13）
          - **不含 Wine / Box64 / DXVK 等二进制**，需自行导入 .rat 包
          - 参考 [README §3](https://github.com/${{ github.repository }}/blob/${VERSION}/README.md) 获取 .rat 包
          - 首次启动后：
            1. 去「包」tab 导入 5 个核心 .rat 包（Core/Wine/Box64/DXVK/VulkanDriver）
            2. 去「前缀」tab 启动 X Server
            3. 去「输入」tab 授权悬浮窗权限并激活虚拟按键
          - 蓝牙手柄暂未支持（v0.5 计划）

          ### 完整变更日志

          见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${VERSION}/CHANGELOG.md) 或对比 commit 历史。
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          body_path: release_body.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          tag_name: ${{ inputs.tag_name }}
          name: Winfex ${{ inputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
