name: Lint & Format

on:
  workflow_dispatch:
    inputs:
      run_ktlint:
        description: 'Run ktlint style check'
        type: boolean
        default: true
      run_android_lint:
        description: 'Run Android Lint'
        type: boolean
        default: true

jobs:
  lint:
    name: Lint Kotlin & XML
    if: ${{ inputs.run_android_lint == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --continue || true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 7

  ktlint:
    name: Kotlin style check
    if: ${{ inputs.run_ktlint == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ktlint
        run: |
          curl -sSL https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint -o /usr/local/bin/ktlint
          chmod +x /usr/local/bin/ktlint

      - name: Run ktlint
        run: |
          ktlint --reporter=checkstyle,output=ktlint-report.xml \
                 --reporter=html,output=ktlint-report.html \
                 'app/src/main/java/**/*.kt' \
                 'xserver/src/main/java/**/*.kt' \
            || echo "::warning::ktlint found style issues (non-blocking)"

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            ktlint-report.xml
            ktlint-report.html
          if-no-files-found: warn
          retention-days: 7
